<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>블록 월드 RPG</title>
<style>
:root{--panel:rgba(24,26,36,.8);--text:#fff;--gold:#ffd34d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(10,12,18,.85)}}
:root[data-theme="dark"]{--panel:rgba(10,12,18,.85)}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd0f0;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#gc{display:block;position:fixed;inset:0;width:100%;height:100%}
.p{position:fixed;background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;border:2px solid rgba(255,255,255,.18)}
#st{left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:220px}
.bar{height:14px;background:#0006;border-radius:7px;overflow:hidden;margin-top:5px;position:relative}
.bar i{display:block;height:100%;width:100%;transition:width .2s}
#hpb{background:#ef4b4b}#xpb{background:#4bb8ef}
.bar b{position:absolute;inset:0;font-size:10px;text-align:center;line-height:14px;font-weight:400}
#inv{margin-top:6px;font-size:12px;line-height:1.5;opacity:.95}
#coin{right:10px;top:calc(10px + env(safe-area-inset-top,0px));color:var(--gold);font-size:17px}
#mmw{right:10px;top:calc(56px + env(safe-area-inset-top,0px));padding:3px;border-radius:50%;line-height:0;cursor:pointer}
#mm{width:120px;height:120px;border-radius:50%}
#qs{right:10px;top:calc(190px + env(safe-area-inset-top,0px));max-width:180px;line-height:1.45}
#qs h4{margin:0 0 3px;color:var(--gold);font-size:13px;font-weight:700}
#hint{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.85;white-space:nowrap}
#toast{left:50%;top:20%;transform:translateX(-50%);font-size:19px;text-align:center;display:none;max-width:80vw}
.fl{position:fixed;pointer-events:none;font-size:19px;font-weight:700;text-shadow:0 2px 0 #000,0 0 6px #000;transform:translate(-50%,-50%)}
.tag{position:fixed;pointer-events:none;transform:translate(-50%,-100%);font-size:12px;background:var(--panel);padding:3px 8px;border-radius:8px;white-space:nowrap}
.btn{position:fixed;border-radius:50%;border:3px solid #fff8;background:var(--panel);color:#fff;font-size:24px;display:none;align-items:center;justify-content:center}
#bA{right:22px;bottom:calc(50px + env(safe-area-inset-bottom,0px));width:76px;height:76px}
#bJ{right:112px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:58px;height:58px}
#bE{right:22px;bottom:calc(140px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:18px}
#bQ{right:92px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:46px;height:46px;font-size:20px}
#stick{position:fixed;left:30px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:var(--panel);display:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffb}
.touch .btn{display:flex}.touch #stick{display:block}.touch #hint{display:none}
#shop,#map{display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);max-height:76vh;overflow:auto;padding:14px;font-size:14px}
#shop h3,#map h3{margin:0 0 10px;display:flex;justify-content:space-between;font-size:16px}
#shop h3 span{color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #fff2}
.row small{display:block;opacity:.7;font-size:12px}
.row button,.x{background:#ffd34d;color:#222;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:13px}
.row button:disabled{background:#555;color:#aaa}
.x{background:#fff3;color:#fff;width:100%;margin-top:10px;padding:8px}
#fm{width:100%;border-radius:10px;background:#0006}
</style>
<style id="ui-fix-z">
#shop,#map,#iv,.p#cu{z-index:50!important;pointer-events:auto!important}
#shop button,#map button,#iv button,.p#cu button,.row button,.x{pointer-events:auto!important;cursor:pointer!important;touch-action:manipulation!important}
#shop,.p#cu,#iv{touch-action:auto!important;-webkit-user-select:auto!important;user-select:auto!important}
#rpgAdminBtn{position:fixed;right:12px;top:calc(240px + env(safe-area-inset-top,0px));z-index:30;border:1px solid #ff6b6b88;border-radius:10px;background:#3a1520dd;color:#fff;padding:9px 12px;font:600 13px system-ui;display:none;touch-action:manipulation}
#rpgAdmin{display:none;position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,94vw);max-height:80vh;overflow:auto;background:#171b27f5;color:#fff;border:1px solid #ff6b6b66;border-radius:14px;padding:16px;box-shadow:0 12px 40px #0008;font:13px system-ui}
#rpgAdmin h3{margin:0 0 10px}
#rpgAdmin table{width:100%;border-collapse:collapse}
#rpgAdmin th,#rpgAdmin td{border-bottom:1px solid #ffffff22;padding:6px 4px;text-align:left}
#rpgAdmin button{background:#ffd34d;color:#222;border:0;border-radius:6px;padding:4px 8px;font-weight:700;margin:1px;cursor:pointer}
#rpgAdmin button.danger{background:#e74c3c;color:#fff}
#rpgAdmin input{width:70px;background:#252b3a;color:#fff;border:1px solid #ffffff44;border-radius:6px;padding:4px}
</style>
</head><body>
<canvas id="gc"></canvas>
<div class="p" id="st"><div id="nm"></div><div class="bar"><i id="hpb"></i><b id="hpt"></b></div><div class="bar"><i id="xpb"></i><b id="xpt"></b></div><div id="inv"></div></div>
<div class="p" id="coin"></div>
<div class="p" id="mmw" onclick="togMap()"><canvas id="mm" width="160" height="160"></canvas></div>
<div class="p" id="qs"><h4>퀘스트</h4><span id="qt"></span></div>
<div class="p" id="hint">WASD 이동 · Space 점프 · X 공격 · 1~5 스킬 · 우클릭 드래그 시점 · E 상호작용 · Q 물약 · C 꾸미기 · M 지도</div>
<div class="p" id="toast"></div>
<div class="p" id="shop"></div>
<div class="p" id="map"><h3><span>🗺️ 월드 지도</span></h3><canvas id="fm" width="400" height="400"></canvas><button class="x" onclick="togMap()">닫기</button></div>
<div id="stick"><div id="knob"></div></div>
<div class="btn" id="bA">⚔️</div><div class="btn" id="bJ">⤒</div><div class="btn" id="bE">E</div><div class="btn" id="bQ">🧪</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const mobilePerf=('ontouchstart' in window)||matchMedia('(pointer: coarse)').matches||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const R=new THREE.WebGLRenderer({canvas:$('gc'),antialias:false,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio||1,mobilePerf?1.0:1.5));R.setSize(innerWidth,innerHeight);
const S=new THREE.Scene();S.background=new THREE.Color(0x8fd0f0);S.fog=new THREE.Fog(0x8fd0f0,45,140);
const C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
S.add(new THREE.HemisphereLight(0xffffff,0x6a8a50,.85));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(30,50,20);S.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const GC={},MC={};function box(w,h,d,c,x=0,y=0,z=0){const k=w+'_'+h+'_'+d;const m=new THREE.Mesh(GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d)),MC[c]||(MC[c]=M(c)));m.position.set(x,y,z);return m}
const rnd=(a,b)=>a+Math.random()*(b-a);
const hex=c=>'#'+c.toString(16).padStart(6,'0');
// ---------- zones / world ----------
const ZN=[{n:'시작 마을',a:0,b:18,c:0xd9c48a,s:'안전지대'},{n:'슬라임 평원',a:18,b:43,c:0x7ad87a,s:'★'},{n:'늑대 숲',a:43,b:63,c:0x4f8f6a,s:'★★'},{n:'고블린 캠프',a:63,b:81,c:0x9a8a3a,s:'★★★'},{n:'해골 묘지',a:81,b:92,c:0x8a8a9a,s:'★★★★'},{n:'골렘 영역',a:92,b:100,c:0x9a5a5a,s:'★★★★★'}];
const gr=new THREE.Mesh(new THREE.PlaneGeometry(260,260),M(0x62b44c));gr.rotation.x=-Math.PI/2;S.add(gr);
ZN.forEach((z,i)=>{if(!i){const m=new THREE.Mesh(new THREE.CircleGeometry(z.b,48),new THREE.MeshLambertMaterial({color:z.c,transparent:true,opacity:.5}));m.rotation.x=-Math.PI/2;m.position.y=.01;S.add(m);return}
 const m=new THREE.Mesh(new THREE.RingGeometry(z.a,z.b,64),new THREE.MeshLambertMaterial({color:z.c,transparent:true,opacity:.5}));m.rotation.x=-Math.PI/2;m.position.y=.01;S.add(m)});
const edge=new THREE.Mesh(new THREE.RingGeometry(100,101.5,64),M(0x333333));edge.rotation.x=-Math.PI/2;edge.position.y=.03;S.add(edge);
S.add(box(5,.05,36,0xc9a66b,0,.03,0));
for(let i=0;i<70;i++){const a=rnd(0,6.28),r=rnd(20,96),x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<3)continue;const t=new THREE.Group();const dead=r>80;
 t.add(box(1,3,1,0x7a5230,0,1.5,0),box(4,2,4,dead?0x555a50:0x2e8b3e,0,3.8,0),box(2.6,1.8,2.6,dead?0x666b60:0x39a34b,0,5.4,0));t.position.set(x,0,z);S.add(t);(self.COL=self.COL||[]).push({x,z,r:1.2})}
for(let i=0;i<14;i++){const a=rnd(0,6.28),r=rnd(82,91);S.add(box(1.2,1.8,.4,0xaaaaaa,Math.cos(a)*r,.9,Math.sin(a)*r))}
for(let i=0;i<6;i++){const c=new THREE.Group();c.add(box(8,2,4,0xffffff),box(5,2,3,0xffffff,2,1.5,0));c.position.set(rnd(-80,80),rnd(28,40),rnd(-80,80));S.add(c)}
function house(x,z,c){const h=new THREE.Group();h.add(box(7,4,6,c,0,2,0),box(8,.6,7,0x8b3a2e,0,4.3,0),box(1.6,2.6,.2,0x5a3a20,0,1.3,3.05));h.position.set(x,0,z);S.add(h)}
house(-15,-12,0xe8d9a8);house(14,-12,0xd9b0a0);house(-16,13,0xb8d0e0);house(15,14,0xcfe0b0);
// ---------- characters ----------
function char(skin,shirt,pants,sword){const g=new THREE.Group();const torso=box(1,1.2,.5,shirt,0,1.6,0);
 g.add(torso,box(.9,.9,.9,skin,0,2.65,0),box(.12,.12,.05,0x111111,-.2,2.7,.46),box(.12,.12,.05,0x111111,.2,2.7,.46));
 const lim=(w,h,c,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);p.add(box(w,h,.4,c,0,-h/2+.1,0));g.add(p);return p};
 const o={g,torso,armL:lim(.3,1.1,skin,-.65,2.1),armR:lim(.3,1.1,skin,.65,2.1),legL:lim(.45,1,pants,-.25,1),legR:lim(.45,1,pants,.25,1)};
 if(sword){const s=new THREE.Group();o.blade=box(.12,1.4,.12,0x8b6a2a,0,-1.6,0);s.add(o.blade,box(.5,.12,.14,0x8b6a2a,0,-.95,0),box(.14,.3,.14,0x5a3a20,0,-.8,0));o.armR.add(s)}
 return o}
const WP=[['나무검',0,0,0x8b6a2a],['철검',8,60,0xcfd8e0],['강철검',18,200,0x6ab0ff],['용사검',35,600,0xffd34d],['마검',60,1500,0xb04bff]];
const AR=[['천 옷',0,0,0x3b78e0],['가죽갑옷',20,50,0x9a6a3a],['철갑옷',50,180,0xaab4be],['미스릴 갑옷',100,550,0x59e0d0]];
const PT=[['체력 물약',60,15],['고급 물약',200,45]];
const P=char(0xf5c98a,0x3b78e0,0x2a3a7a,true);S.add(P.g);
const me={x:0,z:8,y:0,vx:0,vz:0,vy:0,hp:100,mhp:100,lv:1,xp:0,nx:30,coin:0,at:0,face:0,inv:0,w:0,a:0,pot:[2,0],rg:0};
function stats(){const old=me.mhp;me.mhp=100+Math.floor((()=>{let s=0;for(let L=2;L<=me.lv;L++)s+=L<10?10:L<20?25:50;return s})()*(me.jhp||1))+AR[me.a][1];me.hp=Math.min(me.mhp,me.hp+Math.max(0,me.mhp-old));P.blade.material.color.setHex(WP[me.w][3]);P.torso.material.color.setHex(AR[me.a][3])}
const lvm=()=>Math.min(2.5, Math.pow(1.2, Math.max(0,(me.lv||1)-1)));
const atk=()=>Math.floor((10+(WP[me.w]?WP[me.w][1]:0))*lvm()*(me.jm||1)*(me.bf>0?me.bfm:1));
// ---------- NPCs / shops ----------
const NP=[{n:'촌장',t:'q',x:4,z:-7,sh:0x8e44ad,e:'🧙'},{n:'길드장',t:'g',x:-3,z:-10,sh:0xd35400,e:'📜'},{n:'무기상',t:'w',x:-9,z:-3,sh:0xc0392b,e:'⚔️'},{n:'방어구상',t:'a',x:-9,z:6,sh:0x7f8c8d,e:'🛡️'},{n:'물약상',t:'p',x:9,z:4,sh:0x27ae60,e:'🧪'}];
NP.forEach(n=>{const c=char(0xf5c98a,n.sh,0x4a3a2a,false);c.g.position.set(n.x,0,n.z);n.c=c;S.add(c.g);
 if(n.t!='q'){S.add(box(3.4,.3,3.4,n.sh,n.x,3.9,n.z+.8),box(.25,3.8,.25,0x5a3a20,n.x-1.5,1.9,n.z+2.3),box(.25,3.8,.25,0x5a3a20,n.x+1.5,1.9,n.z+2.3),box(2.8,1,.9,0x8b5a2b,n.x,.5,n.z+1.4))}
 else c.g.add(box(1.1,.5,1.1,0xdddddd,0,3.3,0));
 n.tag=document.createElement('div');n.tag.className='tag';document.body.appendChild(n.tag)});
function nearNPC(){let b=null,bd=5;for(const n of NP){const d=Math.hypot(me.x-n.x,me.z-n.z);if(d<bd){bd=d;b=n}}return b}
// ---------- monsters ----------
const MT={slime:{hp:30,dmg:6,xp:12,g:3,sp:3.6,r:[21,40],n:12,sc:1,reach:1.8,rt:8,nm:'슬라임'},wolf:{hp:55,dmg:10,xp:20,g:6,sp:8,r:[46,60],n:10,sc:1,reach:2.2,rt:8,nm:'늑대'},
 goblin:{hp:90,dmg:14,xp:32,g:10,sp:5,r:[66,78],n:8,sc:1.1,reach:2.3,rt:10,nm:'고블린'},skeleton:{hp:140,dmg:20,xp:55,g:18,sp:5.5,r:[83,90],n:7,sc:1.15,reach:2.4,rt:12,nm:'해골 병사'},
 golem:{hp:500,dmg:38,xp:220,g:90,sp:3,r:[94,98],n:3,sc:2.4,reach:4.4,rt:30,nm:'골렘'}};
const E=[];
function spawn(e){const a=Math.random()*6.283,r=rnd(e.d.r[0],e.d.r[1]);e.x=Math.cos(a)*r;e.z=Math.sin(a)*r;e.hp=e.d.hp;e.dead=false;e.kx=e.kz=0;e.g.visible=true}
function mk(type){const d=MT[type];const e={type,d,sc:d.sc,cd:0,t:Math.random()*6};
 if(type=='slime'){const g=new THREE.Group(),b=box(1.6,1.2,1.6,0x4cd964,0,.6,0);b.material.transparent=true;b.material.opacity=.85;g.add(b,box(.2,.2,.1,0,-.3,.8,.81),box(.2,.2,.1,0,.3,.8,.81));e.g=g;e.hy=1.8}
 else if(type=='wolf'){const g=new THREE.Group();g.add(box(1,.8,2,0x7d838c,0,1,0),box(.8,.7,.8,0x8d939c,0,1.3,1.3),box(.4,.3,.5,0x333333,0,1.1,1.8),box(.15,.3,.15,0x7d838c,-.25,1.8,1.2),box(.15,.3,.15,0x7d838c,.25,1.8,1.2),box(.15,.15,.8,0x7d838c,0,1.3,-1.3),box(.12,.12,.05,0xff3030,-.2,1.45,1.72),box(.12,.12,.05,0xff3030,.2,1.45,1.72));
  e.lg=[[-.35,.8],[.35,.8],[-.35,-.8],[.35,-.8]].map(([x,z])=>{const p=new THREE.Group();p.position.set(x,.7,z);p.add(box(.25,.7,.25,0x6a6f78,0,-.35,0));g.add(p);return p});e.g=g;e.hy=2.4}
 else if(typeof BLD!='undefined'&&BLD[type])BLD[type](e,d);else{const f={goblin:[0x6aa84f,0x8b2e2e,0x3a2a1a],skeleton:[0xeeeeee,0xdddddd,0xbbbbbb],golem:[0x8a9a9a,0x6b7a7a,0x55625f]}[type];const c=char(f[0],f[1],f[2],type!='golem');e.g=c.g;e.c=c;e.g.scale.setScalar(d.sc);e.hy=3.8}
 e.hb=box(1.6,.16,.05,0xef4b4b,0,e.hy,0);e.g.add(e.hb);S.add(e.g);spawn(e);E.push(e)}

// ---------- UI ----------
const fls=[];function float(pos,txt,col){const d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.color=col;document.body.appendChild(d);fls.push({d,p:pos.clone(),t:0})}
let tt;function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2400)}
const q={s:0,k:0};let ui=0,shopT='';
function hud(){$('nm').textContent='🧑 용사 Lv.'+me.lv;$('hpb').style.width=me.hp/me.mhp*100+'%';$('hpt').textContent=Math.ceil(me.hp)+' / '+me.mhp;
 $('xpb').style.width=me.xp/me.nx*100+'%';$('xpt').textContent='EXP '+me.xp+' / '+me.nx;$('coin').textContent='🪙 '+me.coin;
 $('inv').innerHTML='⚔️ '+WP[me.w][0]+' (공격 '+atk()+')<br>🛡️ '+AR[me.a][0]+'<br>🧪 물약 '+me.pot[0]+' / 고급 '+me.pot[1]+' (Q)';
 $('qt').innerHTML=q.s==0?'촌장에게 말을 걸어보세요.':q.s==1?'슬라임 5마리 처치 ('+q.k+'/5)':q.s==2?'촌장에게 돌아가 보상을 받으세요!':'퀘스트 완료! 상점에서 장비를 사고 더 멀리 모험하세요.'}
function gain(x){me.xp+=x;while(me.xp>=me.nx){me.xp-=me.nx;me.lv++;me.nx=Math.floor(me.nx*1.32);const o=me.mhp;stats();me.hp=me.mhp;if(me.lv%2===0){me.talentPts=(me.talentPts||0)+1;toast('🎉 레벨 업! Lv.'+me.lv+' · 특성 +1');}else toast('🎉 레벨 업! Lv.'+me.lv);float(P.g.position.clone().setY(4),'LEVEL UP!','#ffd34d')}hud()}
function usePot(){if(me.hp<=0||me.hp>=me.mhp)return;const i=me.pot[0]>0?0:me.pot[1]>0?1:-1;if(i<0){toast('물약이 없어요! 물약상에서 구매하세요.');return}
 me.pot[i]--;me.hp=Math.min(me.mhp,me.hp+PT[i][1]);float(P.g.position.clone().setY(3.5),'+'+PT[i][1],'#6bff8a');hud()}
function talk(){const n=nearNPC();if(!n||me.hp<=0)return false;
 if(n.t=='q'){if(q.s==0){q.s=1;q.k=0;toast('촌장: 평원의 슬라임 5마리를 처치해 주게!')}else if(q.s==1)toast('촌장: 슬라임 '+(5-q.k)+'마리 더!');
  else if(q.s==2){q.s=3;me.coin+=80;toast('촌장: 고맙네! 🪙80 + EXP 40');gain(40)}else toast('촌장: 멀리 갈수록 몬스터가 강해진다네!');hud()}

function useSkillBook(id){

function swapExtraSkill(i){

}

<script>
/* ===== v10: 검 꾸미기 / 자연스러운 모션 / 제없알 스타일 스킬 VFX ===== */
(function(){
// ---------- 검 모델 강화 ----------
function rebuildSword(){
  // 기존 검 제거 후 등급별 화려한 검으로 교체
  if(!P||!P.armR)return;

    // 새로 만들기
    swordG=new THREE.Group();
    P.armR.add(swordG);
  }
  while(swordG.children.length)swordG.remove(swordG.children[0]);
  const w=me.w|0, col=WP[w]?WP[w][3]:0x8b6a2a;
  const isDrop=WP[w]&&WP[w][4]==='drop';

  if(tier>=3)swordG.add(box(.12,.18,.12,guardCol,-.28,-.95,0),box(.12,.18,.12,guardCol,.28,-.95,0));
  // 칼날
  const bladeLen=tier>=5?1.7:tier>=3?1.5:1.35;
  const blade=box(.11,bladeLen,.08,col,0,-.95-bladeLen/2,0);

  // 칼끝
  const tip=new THREE.Mesh(new THREE.ConeGeometry(.08,.25,4),M(col));
  tip.position.set(0,-.95-bladeLen-.1,0);tip.rotation.x=Math.PI;swordG.add(tip);
  // 고급 검: 광택/룬/오라
  if(tier>=2){
    const edge=box(.02,bladeLen*.9,.09,0xffffff,0,-.95-bladeLen/2,.05);
    edge.material=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35});
    swordG.add(edge);
  }
  if(tier>=4){
    // 룬 라인
    const rune=box(.04,bladeLen*.6,.1,col,0,-.95-bladeLen/2,0);
    rune.material=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.7});
    swordG.add(rune);
  }
  if(tier>=6||isDrop){
    // 발광 코어
    const glowCore=box(.06,bladeLen*.5,.06,col,0,-.95-bladeLen/2,0);
    glowCore.material=new THREE.MeshBasicMaterial({color:col});
    swordG.add(glowCore);
  }
  // 용사검 이상 가드 보석
  if(tier>=4){
    const gem=box(.1,.1,.1,0xff4a6a,0,-.95,.12);
    gem.material=new THREE.MeshBasicMaterial({color:tier>=7?0xffffff:0xff4a6a});
    swordG.add(gem);
  }
  P.swordG=swordG;
}
// stats 후 검 갱신 훅
const _stats=stats;

// ---------- 더 자연스러운 걷기/점프/공격 모션 ----------
let walkPhase=0, atkPhase=0;
const _ext=ext;
ext=function(dt){
  _ext(dt);
  // 걷기 모션 개선
  const spd=Math.hypot(me.vx,me.vz);
  const running=spd>8;
  if(me.y<=.05&&me.at<=0&&spinT<=0&&dashT<=0){
    if(spd>1){
      walkPhase+=dt*(running?14:10);
      const w=Math.sin(walkPhase);
      const amp=running?.95:.7;
      P.legL.rotation.x=w*amp;
      P.legR.rotation.x=-w*amp;
      P.armL.rotation.x=-w*amp*.85;
      if(me.at<=0)P.armR.rotation.x=w*amp*.7;
      // 상체 살짝 앞으로 기울임
      P.torso.rotation.x=running?.12:.06;
      // 머리 미세 움직임
      if(P.g.children[1])P.g.children[1].position.y=2.65+Math.abs(w)*.03;
    }else{
      // idle 미세 숨쉬기
      walkPhase+=dt*2;
      const breath=Math.sin(walkPhase)*.04;
      P.torso.rotation.x=breath;
      P.legL.rotation.x=0;P.legR.rotation.x=0;
      P.armL.rotation.x=breath;if(me.at<=0)P.armR.rotation.x=-breath;
    }
  }
  // 점프 모션
  if(me.y>.05){
    P.legL.rotation.x=.5;P.legR.rotation.x=-.35;
    P.armL.rotation.x=-2.4;
    if(me.at<=0)P.armR.rotation.x=-2.2;
    P.torso.rotation.x=-.15;
  }
  // 공격 스윙 모션 강화
  if(me.at>0){
    const t=1-me.at/.35;
    // 크게 올려 내려찍는 스윙
    const swing=Math.sin(t*Math.PI);
    P.armR.rotation.x=-.3-swing*2.4;
    P.armR.rotation.z=Math.sin(t*Math.PI)*.6;
    P.torso.rotation.y=Math.sin(t*Math.PI)*.25;
    if(P.swordG)P.swordG.rotation.x=-swing*.4;
  }else{
    P.armR.rotation.z=0;
    P.torso.rotation.y=0;
    if(P.swordG)P.swordG.rotation.x=0;
  }
  // 스핀 스킬 시 검 궤적
  if(spinT>0&&P.swordG){
    P.swordG.rotation.x=-1.2;
    P.armR.rotation.z=Math.sin(T*20)*.5;
  }
  // 대시 시 몸 기울임
  if(dashT>0){
    P.torso.rotation.x=.35;
    P.armL.rotation.x=-1.5;P.armR.rotation.x=-1.5;
  }
};

// ---------- 화려한 스킬 VFX (검기·연속베기·내려찍기 스타일) ----------
const slashFX=[];
function slashArc(x,z,face,col,size,dur){
  // 부채꼴 검기 이펙트
  const g=new THREE.Group();
  for(let i=-2;i<=2;i++){
    const a=face+i*.25;
    const m=new THREE.Mesh(
      new THREE.BoxGeometry(size*.15,size*.08,size*1.2),
      new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.85})
    );
    m.position.set(Math.sin(a)*size*.6,1.5+Math.abs(i)*.1,Math.cos(a)*size*.6);
    m.rotation.y=a;
    g.add(m);
  }
  // 중앙 검광
  const core=new THREE.Mesh(
    new THREE.BoxGeometry(size*.4,size*.12,size*.3),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9})
  );
  core.position.set(Math.sin(face)*size*.4,1.6,Math.cos(face)*size*.4);
  core.rotation.y=face;g.add(core);
  g.position.set(x,0,z);S.add(g);
  slashFX.push({g,t:0,dur:dur||.35});
}
function groundSlamFX(x,z,r,col){
  fxRing(x,z,r,col,.5);
  // 충격파 파티클 박스
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const m=new THREE.Mesh(new THREE.BoxGeometry(.3,.8,.3),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.7}));
    m.position.set(x+Math.cos(a)*r*.5,1,z+Math.sin(a)*r*.5);
    S.add(m);
    slashFX.push({g:m,t:0,dur:.4,vy:8,vx:Math.cos(a)*6,vz:Math.sin(a)*6});
  }
}
function multiSlashFX(x,z,face,col,n){
  for(let i=0;i<n;i++)setTimeout(()=>slashArc(x,z,face+(i-(n-1)/2)*.15,col,5+i*.5,.28),i*80);
}

// slashFX 업데이트
const _ext2=ext;
ext=function(dt){
  _ext2(dt);
  for(let i=slashFX.length-1;i>=0;i--){
    const f=slashFX[i];f.t+=dt;const p=f.t/f.dur;
    if(f.vy!==undefined){
      f.g.position.y+=f.vy*dt;f.g.position.x+=f.vx*dt;f.g.position.z+=f.vz*dt;
      f.vy-=25*dt;
      if(f.g.material)f.g.material.opacity=.7*(1-p);
    }else if(f.g.traverse){
      f.g.traverse(c=>{if(c.material&&c.material.opacity!==undefined)c.material.opacity=.85*(1-p)});
      f.g.scale.setScalar(1+p*.4);
    }
    if(p>=1){S.remove(f.g);slashFX.splice(i,1)}
  }
};

// ---------- 스킬 실행 시 VFX 연결 + 제없알 스타일 새 스킬 이름/연출 ----------
const _runSk=runSk;
runSk=function(s,a){

    if(A>=10)groundSlamFX(me.x,me.z,A,C||0xffa040); // 내려찍기/지진 스타일

    else slashArc(me.x,me.z,me.face,C||0xff9a4a,A,.35);
  }else if(t==='shoot'){
    // 검기 발사 스타일: 검 궤적 후 발사
    slashArc(me.x,me.z,me.face,B||0xff7a1a,4,.25);
  }else if(t==='volley'){
    multiSlashFX(me.x,me.z,me.face,0xffe9a0,A);
  }else if(t==='dash'){
    slashArc(me.x,me.z,me.face,0xffffff,5,.3);
  }
  _runSk(s,a);
};

// 기본 공격에도 약한 검광
const _attack=attack;
attack=function(){

};

})();

(function(){
// 스킬 아이콘을 이모지 대신 색상 도형으로 표시
const SHAPE_MAP={
  '🌀':{s:'◆',c:'#9fe8ff'},'🔥':{s:'▲',c:'#ff7a1a'},'💨':{s:'▶',c:'#e0e8ff'},'🌋':{s:'▼',c:'#ffa040'},

  '🎯':{s:'◎',c:'#ffffff'},'🌧️':{s:'≡',c:'#9fe8ff'},'💚':{s:'♥',c:'#6bff8a'},'🙏':{s:'✚',c:'#fff0a0'},
  '⚖️':{s:'⚖',c:'#ffd34d'},'⚔️':{s:'╳',c:'#cfd8e0'},'🗡️':{s:'╱',c:'#ffe9a0'},'👊':{s:'●',c:'#d08050'},
  '🦵':{s:'▼',c:'#c08040'},'⬇️':{s:'▼',c:'#c08040'},'💣':{s:'◉',c:'#ff6a1a'},'🏴':{s:'⚑',c:'#c0392b'},
  '🌊':{s:'≈',c:'#4aa8ff'},'💀':{s:'✖',c:'#cccccc'},'🌑':{s:'●',c:'#4a2a6a'},'👻':{s:'◇',c:'#b04bff'},
  '☠️':{s:'✕',c:'#2a1a3a'},'🩸':{s:'◆',c:'#ff3a5a'},'🏃':{s:'▶',c:'#a0c0ff'},'💪':{s:'▲',c:'#ffd34d'}
};
function shapeOf(ic){
  const m=SHAPE_MAP[ic];
  if(m)return '<span style="color:'+m.c+';font-size:20px;font-weight:700;line-height:1;text-shadow:0 1px 2px #000">'+m.s+'</span>';
  // 없으면 첫 글자 또는 기본 도형
  return '<span style="color:#ffd34d;font-size:18px;font-weight:700">●</span>';
}

// 스킬바 아이콘 갱신

refreshSb=function(){
  _refreshSb();
  [...sb.children].forEach((d,i)=>{
    const s=SKL[i];if(!s)return;
    const span=d.querySelector('span');
    if(span)span.innerHTML=shapeOf(s.ic);
    else{
      const sp=document.createElement('span');
      sp.innerHTML=shapeOf(s.ic);
      d.insertBefore(sp,d.firstChild);
    }
  });
};
refreshSb();

const _drawSkillShop=typeof drawSkillShop==='function'?drawSkillShop:null;
if(_drawSkillShop){

    _drawSkillShop();

    $('shop').querySelectorAll('.row').forEach(row=>{
      const div=row.querySelector('div');
      if(!div)return;
      const t=div.childNodes[0];
      if(t&&t.nodeType===3){
        const txt=t.textContent||'';
        const m=txt.match(/^(\S+)\s/);
        if(m&&SHAPE_MAP[m[1]]){
          const sh=SHAPE_MAP[m[1]];
          t.textContent=txt.replace(m[1],sh.s);
          div.style.color=sh.c;
        }
      }
    });
  };
}

// 스킬북 목록의 ic를 도형 문자로 바꿔두면 표시도 깔끔

 const dash=document.createElement('button');dash.id='dashBtn';dash.innerHTML='DASH <small style="margin-left:3px">0</small>';dash.title='대쉬 (0 / V)';
 const lock=document.createElement('button');lock.id='lockBtn';lock.textContent='시점 고정';lock.title='쉬프트락 (Shift)';
 document.body.append(dash,lock);
 let shiftLock=false,dashCooldown=0,dashTime=0;
 function toggleLock(){shiftLock=!shiftLock;window.__lockOn=shiftLock;lock.classList.toggle('active',shiftLock);lock.textContent=shiftLock?'고정 ON':'시점 고정';}
 // 모바일: 게임 전역 touchend 핸들러(더블탭 방지)가 click을 취소하므로 touchstart로 직접 처리
 let _lastTap=0;
 function tapOnce(fn){return e=>{const n=performance.now();if(n-_lastTap<250)return;_lastTap=n;e.preventDefault();fn()}}
 lock.addEventListener('touchstart',tapOnce(toggleLock),{passive:false});
 lock.addEventListener('click',tapOnce(toggleLock));
 const DASH_DIST=9,DASH_DUR=.14,DASH_CD=1.25;
 let dashDx=0,dashDz=1,dashLabel=dash.querySelector('small');
 function doDash(){
   if(dashCooldown>0||dashTime>0||me.hp<=0||ui||(typeof mapOn!=='undefined'&&mapOn))return;
   // 이동 입력(현재 속도) 방향 우선, 없으면 바라보는 방향
   const sp=Math.hypot(me.vx,me.vz);
   if(sp>1){dashDx=me.vx/sp;dashDz=me.vz/sp}else{dashDx=Math.sin(me.face);dashDz=Math.cos(me.face)}
   dashTime=DASH_DUR;dashCooldown=DASH_CD;
   me.inv=Math.max(me.inv||0,DASH_DUR+.15);
   dash.classList.add('active');setTimeout(()=>dash.classList.remove('active'),160);
   try{play('dash')}catch(_){}
 }
 dash.addEventListener('touchstart',tapOnce(doDash),{passive:false});

 addEventListener('keydown',e=>{
   if((e.code==='Digit0'||e.code==='Numpad0'||e.code==='KeyV')&&!e.repeat)doDash();
   if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat)toggleLock();
 });
 const oldLoop=loop;
 loop=function(now){
   const dt=Math.min((now-last)/1000,.05);
   if(dashCooldown>0){
     dashCooldown=Math.max(0,dashCooldown-dt);
     if(dashLabel)dashLabel.textContent=dashCooldown>0?dashCooldown.toFixed(1):'0';
   }
   if(dashTime>0&&me.hp>0){
     const step=Math.min(dt,dashTime);dashTime-=step;
     const d=DASH_DIST/DASH_DUR*step;
     const nx=me.x+dashDx*d,nz=me.z+dashDz*d;
     // 절벽/이동불가 영역 체크 (inW), 맵 밖이면 중단
     const ok=(typeof inW!=='function')||inW(nx,nz);
     if(ok){me.x=nx;me.z=nz;me.vx=dashDx*30;me.vz=dashDz*30;
       if(typeof fxRing==='function'&&Math.random()<.6)try{fxRing(me.x,me.z,1.6,0xffffff,.3)}catch(_){}}
     else dashTime=0;
   }
   oldLoop(now);
 };
 // Z held while moving = sprint; Shift-lock keeps the view centered behind the hero.
 const oldUpdateCamera= C.lookAt.bind(C);
 const cameraPatch=()=>{
   if(shiftLock){
     pit=Math.max(.25,Math.min(.8,pit));
     dist=8.5;
   }
 };
 const oldProjLoop=loop;
 loop=function(now){cameraPatch();oldProjLoop(now)};
 // Build a stone-and-iron dungeon entrance at the village edge, with a glowing portal.
 const dungeon=new THREE.Group();
 const stone=0x555b69, dark=0x17182b, metal=0x7d8797;
 function addBox(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);dungeon.add(m);return m}
 addBox(8,.8,2,stone,0,.4,0);
 addBox(1,5,1,stone,-3,2.5,0);addBox(1,5,1,stone,3,2.5,0);
 addBox(7,1,1.4,stone,0,5,0);addBox(5,.35,1.6,metal,0,4.35,.05);
 addBox(4.8,4,.35,dark,0,2.35,.35);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.65,.16,12,32),new THREE.MeshBasicMaterial({color:0x9b6cff}));
 ring.position.set(0,2.4,.1);dungeon.add(ring);
 const portal=new THREE.Mesh(new THREE.CircleGeometry(1.52,32),new THREE.MeshBasicMaterial({color:0x5526aa,transparent:true,opacity:.72,side:THREE.DoubleSide}));
 portal.position.set(0,2.4,.16);dungeon.add(portal);
 for(let i=0;i<4;i++){const rune=addBox(.18,.55,.12,0xb6a0ff,-2.2+i*1.45,5.75,.1);rune.rotation.z=(i%2?-.25:.25)}
 dungeon.position.set(-153,0,-1868);S.add(dungeon);
 const dlabel=document.createElement('div');dlabel.id='dungeonLabel';dlabel.textContent='DUNGEON GATE · E';document.body.appendChild(dlabel);
 const oldTalk=talk;
 talk=function(){
   if(Math.hypot(me.x+153,me.z+1868)<5 && me.hp>0){
     toast('던전 포탈: 강력한 몬스터가 기다립니다.');return true;
   }
   return oldTalk();
 };
 const oldHud=hud;
 hud=function(){oldHud();};
 // Sprint boost applied in the existing movement loop by adjusting its speed expression.
 // Patch the existing loop's movement speed calculation without changing other mechanics.
 const scripts=[...document.scripts];
 const main=scripts.find(x=>x.textContent.includes('function loop(now)')&&x.textContent.includes('const sp=me.at>0?10:14'));
 if(main && !main.dataset.sprintPatched){
   main.dataset.sprintPatched='1';
   main.textContent=main.textContent.replace('const sp=me.at>0?10:((K.KeyZ && il>.1)?21:14);','const sp=me.at>0?10:((K.KeyZ && il>.1)?21:14);');
   // Sprint while moving: stronger run animation cadence is handled by existing velocity animation.
 }
 // Make the dungeon portal pulse and show an interaction hint when nearby.
 const oldFrame=requestAnimationFrame;
 let decorTick=0;
 function decorate(){
   if(!mobilePerf||decorTick++%3===0){
     const near=Math.hypot(me.x+153,me.z+1868)<7;
     const display=near?'block':'none';if(dlabel.style.display!==display)dlabel.style.display=display;
     ring.rotation.z+=.008;
     portal.material.opacity=.5+Math.sin(performance.now()*.003)*.18;
   }
   requestAnimationFrame(decorate);
 }
 requestAnimationFrame(decorate);
 // Improve existing blocky models with rounded anatomical forms, armor seams and facial details.
 // Added meshes are overlays; base stats, collisions, quests and inventory are unchanged.
 function sphere(parent,r,c,x,y,z,sx=1,sy=1,sz=1){
   const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),M(c));m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m;
 }
 function addHeroDetail(){
   sphere(P.g,.28,0x29201a,0,3.05,-.12,1.1,.5,.6); // hair cap
   sphere(P.g,.12,0xf1c9a2,-.48,2.55,0,.7,1,.8);
   sphere(P.g,.12,0xf1c9a2,.48,2.55,0,.7,1,.8);
   // leather belt and chest armor panels
   const belt=new THREE.Mesh(new THREE.BoxGeometry(1.02,.14,.54),M(0x5a351d));belt.position.set(0,1.13,0);P.g.add(belt);
   const buckle=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.08),M(0xd4b36a));buckle.position.set(0,1.13,.3);P.g.add(buckle);
 }
 addHeroDetail();
 // Add facial, horn, fur and armor details to monster meshes, preserving their original behavior.
 for(const e of E){
   if(e.type==='wolf'||e.type==='bear'){
     sphere(e.g,.16,e.type==='wolf'?0x454b54:0x3a2618,-.22,1.48,1.68,.7,.8,.45);
     sphere(e.g,.16,e.type==='wolf'?0x454b54:0x3a2618,.22,1.48,1.68,.7,.8,.45);
   }else if(e.type==='golem'){
     sphere(e.g,.22,0x4b5c62,-.55,3.1,.25,1,1.3,.8);sphere(e.g,.22,0x4b5c62,.55,3.1,.25,1,1.3,.8);
   }else if(e.type==='dragon'){
     sphere(e.g,.18,0xffb12b,-.45,4.3,4.85,1,.7,.5);sphere(e.g,.18,0xffb12b,.45,4.3,4.85,1,.7,.5);
   }else if(e.type==='goblin'||e.type==='orc'||e.type==='skeleton'){
     sphere(e.g,.11,e.type==='skeleton'?0x292929:0x202020,-.2,2.8,.45,.7,.8,.4);
     sphere(e.g,.11,e.type==='skeleton'?0x292929:0x202020,.2,2.8,.45,.7,.8,.4);
   }
 }
 // Swap common emoji UI glyphs for typographic / geometric symbols, keeping gameplay names intact.
 const glyphs={'⚔️':'╳','⚔':'╳','🛡️':'⬟','🛡':'⬟','🧪':'◉','🪙':'●','🧑':'◆','🗺️':'⌖','🗺':'⌖','🏘️':'⌂','🏘':'⌂','📍':'⌖','🎉':'✦','💀':'✕','✨':'✧','🔥':'▲','💨':'▶','🌀':'◆','🌋':'▼','👕':'◇','🧙':'◆','📜':'▤','🧪':'◉'};
 function deEmoji(str){return str.replace(/⚔️|⚔|🛡️|🛡|🧪|🪙|🧑|🗺️|🗺|🏘️|🏘|📍|🎉|💀|✨|🔥|💨|🌀|🌋|👕|🧙|📜/g,m=>glyphs[m]||'◆');}
 const mo=new MutationObserver(records=>records.forEach(rec=>{
   if(rec.type==='characterData'&&rec.target.nodeValue){const before=rec.target.nodeValue,after=deEmoji(before);if(after!==before)rec.target.nodeValue=after;}
   rec.addedNodes&&rec.addedNodes.forEach(n=>{
     if(n.nodeType===3&&n.nodeValue)n.nodeValue=deEmoji(n.nodeValue);
     else if(n.nodeType===1&&!n.dataset.glyphs){
       n.dataset.glyphs='1';
       const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);
       const a=[];while(w.nextNode())a.push(w.currentNode);
       a.forEach(t=>{t.nodeValue=deEmoji(t.nodeValue)});
     }
   });
 }));
 mo.observe(document.body,{subtree:true,childList:true,characterData:true});
 // Remove the old emoji from the outfit button and show a crisp geometric mark.
 bc.textContent='◇ 꾸미기 (C)';
 // Shift-lock can also be toggled from the mobile control; sprint uses hold-Z only.
 toast('대쉬 0/V · 쉬프트락 Shift · 스프린트 Z');
})();
</script>

<button id="rpgSettingsBtn" type="button" aria-label="설정 열기">⚙ 설정</button>
<section id="rpgSettings" role="dialog" aria-modal="true" aria-labelledby="rpgSettingsTitle">
  <h3 id="rpgSettingsTitle">설정</h3>
  <label class="rpg-setting-row"><span>공격 히트박스 표시</span><input id="rpgHitboxToggle" type="checkbox"></label>
  <label class="rpg-setting-row"><span>화질</span><select id="rpgQuality"><option value="performance">성능 우선</option><option value="balanced" selected>균형</option><option value="quality">화질 우선</option></select></label>
  <div class="rpg-setting-row"><span>멀티플레이어</span><span id="rpgNetBadge">연결 대기</span></div>
  <div id="rpgNetStatus">서버에 연결되면 다른 플레이어가 이 화면에 표시됩니다.</div>
  
  <div class="rpg-setting-row"><label for="rpgPvpToggle">PvP (플레이어 대전)</label><input id="rpgPvpToggle" type="checkbox"></div>
  <div class="rpg-setting-row" style="font-size:12px;opacity:.8">PvP를 켜면 다른 PvP 켠 플레이어와 전투할 수 있습니다.</div>
<div class="rpg-setting-row"><label for="rpgBgmVol">배경음악 (BGM)</label><input id="rpgBgmVol" type="range" min="0" max="100" value="50" style="width:120px"></div>
  <div class="rpg-setting-row"><label for="rpgSfxVol">효과음</label><input id="rpgSfxVol" type="range" min="0" max="100" value="70" style="width:120px"></div>
<div style="display:flex;justify-content:flex-end;margin-top:12px"><button id="rpgSettingsClose" type="button">닫기</button></div>
</section>
<script>
(function(){
  'use strict';
  const byId=id=>document.getElementById(id);
  const settings=byId('rpgSettings');
  byId('rpgSettingsBtn').addEventListener('click',()=>{settings.style.display='block';});
  byId('rpgSettingsClose').addEventListener('click',()=>{settings.style.display='none';});
  addEventListener('keydown',e=>{if(e.key==='Escape')settings.style.display='none';});

  // Quality selector adjusts renderer resolution without recreating the WebGL context.
  const quality=byId('rpgQuality');
  function applyQuality(){
    const v=quality.value;
    const cap=v==='quality'?Math.min(devicePixelRatio||1,1.35):v==='performance'?.7:Math.min(devicePixelRatio||1,mobilePerf?1.0:1.35);
    R.setPixelRatio(cap);R.setSize(innerWidth,innerHeight,false);
  }
  quality.addEventListener('change',applyQuality);

  // A rectangular 3D box is shown briefly for each basic attack when enabled.
  const hitbox=new THREE.Mesh(
    new THREE.BoxGeometry(3.2,2.0,5.0),
    new THREE.MeshBasicMaterial({color:0x42ff91,wireframe:true,transparent:true,opacity:.95,depthTest:false})
  );
  hitbox.visible=false;
  hitbox.renderOrder=999;
  S.add(hitbox);
  let hitboxHideTimer=0;
  const originalAttack=attack;
  attack=function(){
    const before=me.at;
    originalAttack();
    if(byId('rpgHitboxToggle').checked && me.at>before && me.hp>0 && !ui){
      hitbox.position.set(me.x+Math.sin(me.face)*2.6,1.2,me.z+Math.cos(me.face)*2.6);
      hitbox.rotation.set(0,me.face,0);
      hitbox.visible=true;
      clearTimeout(hitboxHideTimer);
      hitboxHideTimer=setTimeout(()=>{hitbox.visible=false;},240);
    }
  };
  byId('rpgHitboxToggle').addEventListener('change',e=>{
    if(!e.target.checked){hitbox.visible=false;clearTimeout(hitboxHideTimer);}
  });

  // WebSocket multiplayer: real nickname from login + server-shared monsters
  const remotes=new Map();
  let ws=null, reconnectTimer=null, closing=false, myNetId=null;
  const status=byId('rpgNetStatus'),badge=byId('rpgNetBadge');
  function setStatus(text,connected){if(status)status.textContent=text;if(badge)badge.textContent=connected?'연결됨':'연결 안 됨';}
  function makeRemote(id,name){
    const group=new THREE.Group();
    const mat=c=>new THREE.MeshLambertMaterial({color:c});
    const torso=new THREE.Mesh(new THREE.BoxGeometry(.9,1.1,.45),mat(0x3b78e0));torso.position.y=1.55;group.add(torso);
    const head=new THREE.Mesh(new THREE.BoxGeometry(.72,.72,.72),mat(0xf0c49a));head.position.y=2.5;group.add(head);
    const legs=new THREE.Mesh(new THREE.BoxGeometry(.72,.7,.4),mat(0x29345a));legs.position.set(0,.55,0);group.add(legs);
    S.add(group);
    const tag=document.createElement('div');tag.className='rpg-player-tag';tag.textContent=name;document.body.appendChild(tag);
    const item={id,name,group,tag,x:0,z:0,y:0,face:0,tx:0,tz:0,ty:0,tf:0};
    remotes.set(id,item);return item;
  }
  function removeRemote(id){
    const p=remotes.get(id);if(!p)return;
    S.remove(p.group);p.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});
    p.tag.remove();remotes.delete(id);
  }
  function setRemote(p){
    if(!p||typeof p.id!=='string'||p.id.length>64)return;
    let r=remotes.get(p.id);if(!r)r=makeRemote(p.id,typeof p.name==='string'?p.name:'플레이어');
    r.name=(typeof p.name==='string'&&p.name)?p.name:'플레이어';r.tag.textContent=r.name;
    r.tx=p.x;r.tz=p.z;r.ty=p.y;r.tf=p.face;
  }

  // 서버 몬스터 동기화 (서버 권한): 위치/체력/사망/공격은 전부 서버 값만 사용
  const serverMonMap=new Map();   // 서버 id -> 로컬 몬스터(e)
  function bindMon(e,sm){
    e.srv=true;e.off=false;e.serverId=sm.id;serverMonMap.set(sm.id,e);
    e.x=e.tx=e.px=sm.x;e.z=e.tz=e.pz=sm.z;e.tf=sm.face||0;e.hp=sm.hp;e.mhp=sm.mhp||(e.d&&e.d.hp)||sm.hp;e.dead=!!sm.dead;e.kx=e.kz=0;
    if(sm.hx!=null)e.home=[sm.hx,sm.hz];
    if(e.g){e.g.visible=!e.dead;e.g.position.set(e.x,0,e.z);e.g.rotation.y=e.tf;}
  }
  function adoptSnapshot(list){
    if(!Array.isArray(list))return;
    const pool={};
    for(const e of E){e.srv=false;e.serverId=null;(pool[e.type]=pool[e.type]||[]).push(e);}
    serverMonMap.clear();
    for(const sm of list){
      if(!sm||typeof sm.type!=='string'||!MT[sm.type])continue;
      let e=(pool[sm.type]||[]).shift();
      if(!e){try{mk(sm.type);e=E[E.length-1];}catch(_){e=null;}}
      if(e)bindMon(e,sm);
    }
    // 서버에 대응되는 몬스터가 없는 로컬 몬스터는 비활성화(서버에 없는 몬스터는 존재하지 않음)
    for(const t in pool)for(const e of pool[t]){e.off=true;e.srv=false;e.dead=true;if(e.g)e.g.visible=false;}
  }
  function applyMonDelta(rows){
    if(!Array.isArray(rows))return;
    for(const r of rows){
      const e=serverMonMap.get(r[0]);if(!e)continue;
      const was=e.dead,fl=r[5]|0;
      e.tx=r[1];e.tz=r[2];e.hp=r[3];e.tf=r[4];e.dead=!!(fl&1);
      if(fl&2)e.atT=.3;
      if(was&&!e.dead){e.x=e.tx;e.z=e.tz;e.px=e.x;e.pz=e.z;if(e.g){e.g.visible=true;e.g.position.set(e.x,0,e.z);}}
    }
  }

  function connect(){
    if(closing)return;
    if(location.protocol!=='http:'&&location.protocol!=='https:'){setStatus('멀티플레이어는 HTTP(S) 서버에서 실행해야 합니다.',false);return;}
    const proto=location.protocol==='https:'?'wss:':'ws:';
    ws=new WebSocket(proto+'//'+location.host+'/ws');
    ws.addEventListener('open',()=>setStatus('서버 연결됨. 닉네임이 다른 플레이어에게 표시됩니다.',true));
    ws.addEventListener('message',ev=>{
      if(typeof ev.data!=='string'||ev.data.length>200000)return;
      let msg;try{msg=JSON.parse(ev.data);}catch(_){return;}
      if(msg.type==='welcome'){
        myNetId=msg.id;
        if(Array.isArray(msg.players))msg.players.forEach(p=>{if(p&&p.id!==msg.id)setRemote(p);});
        adoptSnapshot(msg.monsters);
      }else if(msg.type==='join'&&msg.player){setRemote(msg.player);}
      else if(msg.type==='state'&&msg.player){setRemote(msg.player);}
      else if(msg.type==='leave'&&typeof msg.id==='string'){removeRemote(msg.id);}
      else if(msg.type==='mon'){applyMonDelta(msg.m);}
      else if(msg.type==='mdmg'&&Number.isFinite(msg.dmg)){srvHurtMe(msg.dmg);}
      else if(msg.type==='bfx'&&window.rpgBossFx){try{window.rpgBossFx(msg);}catch(_){}}
      else if(msg.type==='pvp_damage'){
        if(msg.to===myNetId && typeof me!=='undefined'){
          me.hp=Math.max(0, msg.hp);
          if(typeof hud==='function')hud();
          if(typeof float==='function')float(P.g.position.clone().setY(3),'-'+msg.dmg,'#ff6b6b');
          if(me.hp<=0 && typeof toast==='function') toast((msg.name||'적')+' 에게 패배...');
        } else if(msg.from===myNetId && typeof toast==='function'){
          // optional feedback
        }
      }
      else if(msg.type==='kill'){
        // 서버가 "이 몬스터를 네가 처치했다(기여했다)" 고 확정 → 보상/드롭/퀘스트 진행은 기존 kill() 로직 사용
        const e=serverMonMap.get(msg.id);
        if(e&&typeof kill==='function'){try{kill(e);}catch(_){}}
      }
      else if(msg.type==='admin_stat'){try{if(window.__applyAdminStat)window.__applyAdminStat(msg);else{if(Number.isFinite(msg.lv))me.lv=msg.lv;if(Number.isFinite(msg.coin))me.coin=msg.coin;if(typeof hud==='function')hud();}}catch(_){} if(typeof toast==='function')toast('🛠 관리자 스탯 적용');}
      else if(msg.type==='count'){setStatus('서버 접속자: '+msg.count+'명',true);}
    });
    ws.addEventListener('close',()=>{
      setStatus('서버 연결이 끊겼습니다. 재연결 중…',false);
      for(const id of Array.from(remotes.keys()))removeRemote(id);
      if(!closing){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,2500);}
    });
    ws.addEventListener('error',()=>{try{ws.close();}catch(_){}});
  }
  connect();
  window.__rpgReconnect=function(){closing=false;clearTimeout(reconnectTimer);try{if(ws)ws.close();}catch(_){}setTimeout(connect,200);};
  window.__rpgWs=()=>ws; window.__rpgMyNetId=()=>myNetId; window.__rpgRemotes=()=>remotes;
  let lastSent=0;
  function sendPosition(now){
    if(!ws||ws.readyState!==WebSocket.OPEN||now-lastSent<100)return;
    lastSent=now;
    try{ws.send(JSON.stringify({type:'move',x:Number(me.x)||0,z:Number(me.z)||0,y:Number(me.y)||0,face:Number(me.face)||0,pvp:!!window.__pvpEnabled,hp:Number(me.hp)||0,mhp:Number(me.mhp)||100,inv:me.inv>0?1:0}));}catch(_){}
  }

  // 몬스터 타격 보고: 한 프레임의 광역 타격도 하나의 메시지로 묶어서 전송 (피해/사망 판정은 서버)
  const hitQ=new Map();
  window.srvHit=function(e,dm,kb,elem){
    if(!e||e.serverId==null)return;
    dm=Math.max(1,Math.floor(Number(dm)||0));
    const el=elem||window.__skillElem||'slash';
    const c=hitQ.get(e.serverId);
    if(c){c[1]+=dm;c[2]=Math.max(c[2],kb||0);if(el&&el!=='slash')c[3]=el;}else hitQ.set(e.serverId,[e.serverId,dm,kb||0,el]);
    e.hp=Math.max(1,e.hp-dm);   // 서버 응답 전 체감용 임시 표시 (실제 값은 서버 상태로 곧바로 덮어씀)
  };
  setInterval(()=>{
    if(!hitQ.size)return;
    if(!ws||ws.readyState!==WebSocket.OPEN){hitQ.clear();return;}
    const list=[...hitQ.values()].slice(0,60);hitQ.clear();
    try{ws.send(JSON.stringify({type:'hit',list}));}catch(_){}
    window.__skillElem='slash';
  },60);

  function remoteFrame(){
    const now=performance.now();
    sendPosition(now);
    for(const p of remotes.values()){
      p.x+=(p.tx-p.x)*.35;p.z+=(p.tz-p.z)*.35;p.y+=(p.ty-p.y)*.35;
      let d=p.tf-p.face;d=Math.atan2(Math.sin(d),Math.cos(d));p.face+=d*.35;
      p.group.position.set(p.x,p.y,p.z);p.group.rotation.y=p.face;
      const v=new THREE.Vector3(p.x,p.y+3.1,p.z).project(C);
      if(v.z>1){p.tag.style.display='none';}
      else{p.tag.style.display='block';p.tag.style.left=((v.x*.5+.5)*innerWidth)+'px';p.tag.style.top=((-v.y*.5+.5)*innerHeight)+'px';}
    }
    // 서버 몬스터 좌표 유지
    for(const e of serverMonMap.values()){
      if(e.g&&!e.dead)e.g.position.set(e.x,0,e.z);
    }
    requestAnimationFrame(remoteFrame);
  }
  requestAnimationFrame(remoteFrame);
  addEventListener('pagehide',()=>{closing=true;clearTimeout(reconnectTimer);if(ws)ws.close();});
})();
</script>

<script>
(function(){
 'use strict';
 const auth$=id=>document.getElementById(id);
 const curtain=auth$('authCurtain'),msg=auth$('authMessage'),userBar=auth$('authUserBar');
 let currentUser=null,saveBusy=false,lastSaved='';
 const status=t=>{msg.textContent=t;};
 async function api(path,body){
   const res=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
   let data={};try{data=await res.json();}catch(_){}
   if(!res.ok)throw new Error(data.error||'요청에 실패했습니다.');
   return data;
 }
 function getState(){
   const fields=['x','z','y','hp','mhp','lv','xp','nx','coin','at','face','inv','w','a','rg'];
   const player={};for(const k of fields)if(Number.isFinite(Number(me[k])))player[k]=Number(me[k]);
   player.pot=Array.isArray(me.pot)?me.pot.slice(0,8).map(v=>Number(v)||0):[2,0];
   if(me.ow instanceof Set) player.ow=[...me.ow];
   if(me.oa instanceof Set) player.oa=[...me.oa];
   if(me.qa && typeof me.qa==='object') player.qa=me.qa;
   if(me.items && typeof me.items==='object'){player.items={};for(const k in me.items){const v=Math.floor(Number(me.items[k])||0);if(v>0)player.items[k]=Math.min(99999,v)}}
   if(me.qd instanceof Set) player.qd=[...me.qd];
   else if(Array.isArray(me.qd)) player.qd=me.qd.slice();
   if(Number.isFinite(Number(me.we))) player.we=Math.max(0,Math.min(15,Math.floor(Number(me.we))));
   if(Number.isFinite(Number(me.ae))) player.ae=Math.max(0,Math.min(15,Math.floor(Number(me.ae))));
   if(Number.isFinite(Number(me.rebirth))) player.rebirth=Math.max(0,Math.min(99,Math.floor(Number(me.rebirth))));
   if(Number.isFinite(Number(me.rcoin))) player.rcoin=Math.max(0,Math.min(1e9,Math.floor(Number(me.rcoin))));
   if(typeof me.title==='string') player.title=me.title.slice(0,24);
   if(me.talents&&typeof me.talents==='object') player.talents=me.talents;
   if(Number.isFinite(Number(me.talentPts))) player.talentPts=Math.max(0,Math.min(500,Math.floor(Number(me.talentPts))));
   if(Array.isArray(me.runes)) player.runes=me.runes.slice(0,40);
   if(me.runeEq&&typeof me.runeEq==='object') player.runeEq=me.runeEq;
   if(Number.isFinite(Number(me.towerBest))) player.towerBest=Math.max(0,Math.min(9999,Math.floor(Number(me.towerBest))));
   return {version:1,player,camera:{yaw:Number(yaw)||0,pit:Number(pit)||.5,dist:Number(dist)||11},savedAt:Date.now()};
 }
 function applyState(s){
   if(!s||typeof s!=='object'||!s.player)return;
   const p=s.player,allowed=['x','z','y','hp','mhp','lv','xp','nx','coin','at','face','inv','w','a','rg'];
   for(const k of allowed){if(Number.isFinite(p[k]))me[k]=p[k];}
   if(Array.isArray(p.pot))me.pot=p.pot.slice(0,8).map(v=>Math.max(0,Math.min(999,Number(v)||0)));
   if(Array.isArray(p.ow)) me.ow=new Set(p.ow);
   if(Array.isArray(p.oa)) me.oa=new Set(p.oa);
   if(p.qa && typeof p.qa==='object') me.qa=Object.assign({}, p.qa);
   if(p.items && typeof p.items==='object'){me.items=me.items||{};for(const k in p.items){const v=Math.floor(Number(p.items[k])||0);if(v>0)me.items[k]=v}}
   if(Array.isArray(p.qd)) me.qd=new Set(p.qd);
   if(Number.isFinite(p.we)) me.we=Math.max(0,Math.min(15,Math.floor(p.we)));
   if(Number.isFinite(p.ae)) me.ae=Math.max(0,Math.min(15,Math.floor(p.ae)));
   if(Number.isFinite(p.rebirth)) me.rebirth=Math.max(0,Math.min(99,Math.floor(p.rebirth)));
   if(Number.isFinite(p.rcoin)) me.rcoin=Math.max(0,Math.min(1e9,Math.floor(p.rcoin)));
   if(typeof p.title==='string') me.title=p.title;
   if(p.talents&&typeof p.talents==='object') me.talents=Object.assign({},p.talents);
   if(Number.isFinite(p.talentPts)) me.talentPts=Math.max(0,Math.min(500,Math.floor(p.talentPts)));
   if(Array.isArray(p.runes)) me.runes=p.runes.slice(0,40);
   if(p.runeEq&&typeof p.runeEq==='object') me.runeEq=Object.assign({w:null,a:null,u:null},p.runeEq);
   if(Number.isFinite(p.towerBest)) me.towerBest=Math.max(0,Math.min(9999,Math.floor(p.towerBest)));
   me.x=Math.max(-1000,Math.min(1000,me.x));me.z=Math.max(-2400,Math.min(400,me.z));
   me.lv=Math.max(1,Math.min(999,me.lv));me.hp=Math.max(0,Math.min(me.mhp,me.hp));
   if(s.camera){if(Number.isFinite(s.camera.yaw))yaw=s.camera.yaw;if(Number.isFinite(s.camera.pit))pit=Math.max(.1,Math.min(1.4,s.camera.pit));if(Number.isFinite(s.camera.dist))dist=Math.max(4,Math.min(24,s.camera.dist));}
   if(typeof stats==='function')try{stats();}catch(_){}
   if(typeof hud==='function')try{hud();}catch(_){}
   if(typeof updateHUD==='function')try{updateHUD();}catch(_){}
 }
 async function save(force){
   if(!currentUser||saveBusy)return;
   const state=getState(),raw=JSON.stringify(state);
   if(!force&&raw===lastSaved)return;
   saveBusy=true;
   try{await api('/api/save',{state});lastSaved=raw;}catch(e){if(force)status('저장 실패: '+e.message);}finally{saveBusy=false;}
 }
 async function enter(data){
   currentUser=data.user;
   applyState(data.state);
   curtain.style.display='none';userBar.style.display='flex';
   auth$('authUserLabel').textContent='접속: '+currentUser;
   msg.textContent='';
   lastSaved=JSON.stringify(getState());
   // Ensure the next periodic save captures the loaded state.
   setTimeout(()=>save(true),800);
 }
 async function authenticate(which){
   const username=auth$('authUsername').value.trim(),password=auth$('authPassword').value;
   if(!username||!password){status('아이디와 비밀번호를 입력해 주세요.');return;}
   auth$('authLogin').disabled=auth$('authRegister').disabled=true;
   try{const data=await api(which==='register'?'/api/register':'/api/login',{username,password});await enter(data);}
   catch(e){status(e.message);}
   finally{auth$('authLogin').disabled=auth$('authRegister').disabled=false;}
 }
 auth$('authLogin').addEventListener('click',()=>authenticate('login'));
 auth$('authRegister').addEventListener('click',()=>authenticate('register'));
 auth$('authPassword').addEventListener('keydown',e=>{if(e.key==='Enter')authenticate('login');});
 auth$('authLogout').addEventListener('click',async()=>{
   await save(true);try{await api('/api/logout',{});}catch(_){}
   currentUser=null;userBar.style.display='none';curtain.style.display='flex';
   auth$('authPassword').value='';status('로그아웃되었습니다. 다시 로그인할 수 있습니다.');
 });
 fetch('/api/me',{credentials:'same-origin'}).then(r=>r.ok?r.json():Promise.reject()).then(enter).catch(()=>{curtain.style.display='flex';});
 setInterval(()=>save(false),5000);
 addEventListener('pagehide',()=>{if(currentUser&&navigator.sendBeacon){
   const payload=JSON.stringify({state:getState()});
   // sendBeacon cannot set JSON content type; endpoint accepts text/plain JSON for this final best-effort save.
   navigator.sendBeacon('/api/save-beacon',new Blob([payload],{type:'text/plain'}));
 }});
})();
</script>

(function(){

      window.ui=0;

      ids.forEach(id=>{const el=document.getElementById(id); if(el) el.style.display='none';});

  if(pvpToggle){
    pvpToggle.addEventListener('change', ()=>{
      window.__pvpEnabled = !!pvpToggle.checked;
      if(typeof toast==='function') toast(window.__pvpEnabled ? 'PvP 활성화' : 'PvP 비활성화');
    });
  }

  // Patch sendPosition payload to include pvp (hook after multipatch)
  const _origStringify = JSON.stringify;
  // Instead wrap attack for pvp
  function tryPvpAttack(){
    if(!window.__pvpEnabled || typeof me==='undefined') return;
    // find nearest remote with pvp - handled via ws message from multiplayer section
    if(window.__sendPvpHit) window.__sendPvpHit();
  }
  addEventListener('keydown', e=>{ if(e.code==='KeyX' || e.code==='KeyF') tryPvpAttack(); });

  // ---- Admin panel ----
  let isAdmin=false;
  async function adminApi(path, body){
    const headers=body?{'Content-Type':'application/json'}:{};
    let tok=null;try{tok=localStorage.getItem('rpg_token');}catch(_){}
    if(tok)headers['x-rpg-token']=tok;
    if(typeof authToken==='string'&&authToken)headers['x-rpg-token']=authToken;
    const res=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers,body:body?JSON.stringify(body):undefined});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error||'요청 실패');
    return data;
  }
  function applyAdminStat(data){
    if(!data||typeof data!=='object')return;
    if(Number.isFinite(data.lv)) me.lv=Math.max(1,Math.floor(data.lv));
    if(Number.isFinite(data.coin)) me.coin=Math.max(0,Math.floor(data.coin));
    if(Number.isFinite(data.xp)) me.xp=Math.max(0,Math.floor(data.xp));
    if(Number.isFinite(data.nx)) me.nx=Math.max(30,Math.floor(data.nx));
    if(Number.isFinite(data.mhp)){me.mhp=Math.max(1,Math.floor(data.mhp));}
    if(Number.isFinite(data.hp)) me.hp=Math.min(me.mhp,Math.max(1,Math.floor(data.hp)));
    try{if(typeof stats==='function')stats();}catch(_){}
    try{if(typeof hud==='function')hud();}catch(_){}
    try{
      if(typeof currentUser==='string'&&currentUser){
        const st=typeof getState==='function'?getState():null;
        if(st) localStorage.setItem('rpg_save_'+currentUser, JSON.stringify(st));
      }
    }catch(_){}
  }
  window.__applyAdminStat=applyAdminStat;

  async function refreshAdminList(){
    const box=document.getElementById('rpgAdminList');
    if(!box) return;
    try{
      const data=await adminApi('/api/admin/users');
      let h='<table><tr><th>닉네임</th><th>Lv</th><th>코인</th><th>상태</th><th>조작</th></tr>';
      for(const u of data.users||[]){
        h+=`<tr>
          <td>${u.username}${u.isAdmin?' <b style="color:#ffd34d">ADMIN</b>':''}</td>
          <td>${u.lv}</td>
          <td>${u.coin}</td>
          <td>${u.banned?'<span style="color:#e74c3c">차단</span>':'정상'}</td>
          <td>
            <button type="button" onclick="window.__adminSetLevel('${u.username}')">레벨</button>
            <button type="button" onclick="window.__adminGiveCoin('${u.username}')">코인</button>
            <button type="button" class="danger" onclick="window.__adminBan('${u.username}', ${u.banned? 'false':'true'})">${u.banned?'해제':'밴'}</button>
          </td>
        </tr>`;
      }
      h+='</table>';
      box.innerHTML=h;
    }catch(e){ box.textContent=e.message; }
  }
  window.__adminBan = async (username, banned)=>{
    try{ await adminApi('/api/admin/ban',{username, banned:!!banned}); toast((banned?'차단':'해제')+': '+username); refreshAdminList(); }
    catch(e){ toast(e.message); }
  };
  window.__adminSetLevel = async (username)=>{
    const level = prompt(username+' 레벨 설정 (1~999)', '10');
    if(level==null) return;
    try{
      const r=await adminApi('/api/admin/set-level',{username, level:Number(level)});
      toast('레벨 변경: '+username+' → Lv.'+(r.lv||level));
      // 본인 계정이면 즉시 반영
      if(currentUser && String(currentUser).toLowerCase()===String(username).toLowerCase()){
        applyAdminStat({lv:r.lv, coin:r.coin, mhp:r.mhp, hp:r.mhp, xp:0});
      }
      refreshAdminList();
    }catch(e){ toast(e.message); }
  };
  window.__adminGiveCoin = async (username)=>{
    const amount = prompt(username+' 에게 코인 지급 (음수면 차감)', '1000');
    if(amount==null) return;
    try{
      const r=await adminApi('/api/admin/give-coin',{username, amount:Number(amount)});
      toast('코인 지급: '+username+' → 🪙'+(r.coin!=null?Number(r.coin).toLocaleString():''));
      if(currentUser && String(currentUser).toLowerCase()===String(username).toLowerCase()){
        applyAdminStat({coin:r.coin});
      }
      refreshAdminList();
    }catch(e){ toast(e.message); }
  };
  const adminBtn=document.getElementById('rpgAdminBtn');
  const adminPanel=document.getElementById('rpgAdmin');
  if(adminBtn){
    adminBtn.addEventListener('click', ()=>{ adminPanel.style.display='block'; refreshAdminList(); });
  }

  // Detect admin from /api/me and login response
  const _fetch = window.fetch;
  // Hook after enter - poll me
  async function checkAdmin(){
    try{
      const res=await fetch('/api/me',{credentials:'same-origin'});
      if(!res.ok) return;
      const data=await res.json();
      isAdmin=!!data.isAdmin;
      if(adminBtn) adminBtn.style.display=isAdmin?'block':'none';
    }catch(_){}
  }
  setInterval(checkAdmin, 8000);
  setTimeout(checkAdmin, 1500);

  // When login succeeds, re-check (observe auth curtain hide)
  const curtain=document.getElementById('authCurtain');
  if(curtain){
    const obs=new MutationObserver(()=>{
      if(curtain.style.display==='none') setTimeout(checkAdmin, 300);
    });
    obs.observe(curtain,{attributes:true,attributeFilter:['style']});
  }

  // Fix: re-bind shop button clicks via event delegation (onclick attr + async)
  document.addEventListener('click', (ev)=>{
    const btn = ev.target.closest && ev.target.closest('button');
    if(!btn) return;
    // ensure close buttons work
    if(btn.classList.contains('x') && (btn.textContent||'').includes('닫기')){
      // already has onclick closeShop - backup
      if(!btn.getAttribute('onclick')) window.closeShop();
    }
  }, true);

})();
</script>

    let h='<h3 style="margin:0 0 8px;display:flex;justify-content:space-between"><span>🏆 리더보드</span><button class="x" style="width:auto;margin:0;padding:4px 10px" onclick="document.getElementById(\'rpgLbPanel\').style.display=\'none\'">닫기</button></h3>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px">';
    for(const t of TABS) h+='<button type="button" onclick="window.__lbTab(\''+t.id+'\')" style="padding:5px 8px;border-radius:8px;border:1px solid '+(curLB===t.id?'#ffd34d':'#fff3')+';background:'+(curLB===t.id?'#ffd34d33':'#fff1')+';color:#fff;cursor:pointer;font-size:12px">'+t.name+'</button>';
    h+='</div>';
    if(data.me) h+='<div style="margin-bottom:8px;padding:6px 8px;background:#ffd34d22;border-radius:8px">내 순위: <b>'+data.me.rank+'위</b> · '+data.me.value+(data.total?' / '+data.total+'명':'')+'</div>';
    h+='<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="opacity:.7"><th style="text-align:left;padding:4px">#</th><th style="text-align:left">이름</th><th style="text-align:right">기록</th></tr>';
    for(const r of (data.rows||[])){
      const mine=r.mine?' style="background:#ffd34d22"':'';
      h+='<tr'+mine+'><td style="padding:5px 4px">'+r.rank+'</td><td>'+(r.on?'<span style="color:#6bff8a">● </span>':'')+(r.name||'?')+(r.sub?' <small style="opacity:.7">'+r.sub+'</small>':'')+'</td><td style="text-align:right;font-weight:600">'+(r.value||'')+'</td></tr>';
    }
    h+='</table><button class="x" onclick="window.__lbTab(\''+curLB+'\')">새로고침</button>';
    lbPanel.innerHTML=h;
  }catch(e){lbPanel.innerHTML='<h3>🏆 리더보드</h3><div style="color:#ffb4a9">'+(e.message||e)+'</div><button class="x" onclick="document.getElementById(\'rpgLbPanel\').style.display=\'none\'">닫기</button>';}
}
window.__lbTab=t=>loadLB(t);
lbBtn.onclick=()=>{if(lbPanel.style.display==='block'){lbPanel.style.display='none';return;}lbPanel.style.display='block';loadLB(curLB);};

window.__rpgOnNetMsg=function(msg){
  if(msg.type==='party'){srvParty=msg.party||null;if(msg.msg&&typeof toast==='function')toast(msg.msg);if(ptyPanel.style.display==='block')drawPartyPanel();}
  else if(msg.type==='p_invited'&&msg.from){
    invEl.innerHTML='<div style="font-size:15px;margin-bottom:8px"><b>'+(msg.from.name||'플레이어')+'</b> 님이 파티에 초대했습니다</div><div style="display:flex;gap:8px;justify-content:center"><button onclick="window.__ptyReply(\''+msg.from.id+'\',true)">수락</button><button class="x" style="width:auto;margin:0" onclick="window.__ptyReply(\''+msg.from.id+'\',false)">거절</button></div>';
    invEl.style.display='block'; setTimeout(()=>{if(invEl.style.display==='block')invEl.style.display='none';},30000);
  }
  else if(msg.type==='p_msg'&&msg.text&&typeof toast==='function')toast(msg.text);
  else if(msg.type==='plist'&&Array.isArray(msg.list)){playerList=msg.list;drawPartyPanel();}
  else if(msg.type==='guild'){myGuild=msg.g;if(gPanel.style.display==='block')drawGuild();}
  else if(msg.type==='chat'&&msg.ch==='guild'&&typeof toast==='function')toast('[길드] '+(msg.name||'')+': '+(msg.text||''));
  else if(msg.type==='admin_stat'&&window.__applyAdminStat)window.__applyAdminStat(msg);
};
addEventListener('keydown',e=>{
  if(e.target&&e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.code==='KeyP'&&!e.repeat){e.preventDefault();window.togPty();}
  if(e.code==='KeyG'&&!e.repeat){e.preventDefault();gBtn.onclick();}
  if(e.code==='KeyL'&&!e.repeat){e.preventDefault();lbBtn.onclick();}
});
})();
</script>


<script>
/* ===== 보스 기믹(쉴드/그로기/장판) + 장비 강화 + 대장장이 ===== */
(function(){
'use strict';
const $=id=>document.getElementById(id);

/* --- 스킬 원소 태그 --- */
const SK_ELEM = {0:'slash',1:'fire',2:'slash',3:'earth',4:'heal'};
// 기본 공격은 'slash', 파이어볼 fire, 지진 earth 등. 쉴드 파괴용
function hitElem(extra){ return extra || 'slash'; }

/* --- 강화 보너스 (클라이언트 표시용, 서버와 동일 공식) --- */
function enhAtkBonus(lv){ return lv<=0?0:Math.floor(lv*3+Math.pow(lv,1.35)); }
function enhHpBonus(lv){ return lv<=0?0:Math.floor(lv*8+Math.pow(lv,1.4)*2); }
if(typeof me.we!=='number') me.we=0;
if(typeof me.ae!=='number') me.ae=0;

/* atk/stats 래핑: 강화 보너스 반영 */
const _atk0 = typeof atk==='function'?atk:null;
if(_atk0){
  window.atk=function(){
    return Math.floor(_atk0() + enhAtkBonus(me.we||0) * (me.jm||1));
  };
}
const _stats0 = typeof stats==='function'?stats:null;
if(_stats0){
  window.stats=function(){
    _stats0();
    const bonus=enhHpBonus(me.ae||0);
    if(bonus>0){
      const old=me.mhp;
      me.mhp += bonus;
      me.hp = Math.min(me.mhp, me.hp + Math.max(0, me.mhp-old));
    }
    updateWeaponAura();
  };
}

/* --- 무기 아우라 (+7 이상) --- */
let auraMesh=null, auraParts=[];
function updateWeaponAura(){
  const lv=me.we||0;
  if(auraMesh){ try{P.armR.remove(auraMesh);}catch(_){} auraMesh=null; }
  for(const p of auraParts){ try{S.remove(p.m);}catch(_){} } auraParts=[];
  if(lv<7||!P||!P.armR) return;
  const col = lv>=13?0xff44ff:lv>=10?0xffd34d:lv>=7?0x6bd0ff:0xffffff;
  const g=new THREE.Group();
  const core=new THREE.Mesh(new THREE.SphereGeometry(.18,8,8), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.85}));
  core.position.set(0,-1.5,0); g.add(core);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.35,.05,6,16), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.6}));
  ring.position.set(0,-1.5,0); ring.rotation.x=Math.PI/2; g.add(ring);
  P.armR.add(g); auraMesh=g;
  // 파티클
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.7}));
    S.add(m); auraParts.push({m, a:i/8*6.283, r:.4+Math.random()*.3, sp:.8+Math.random()*.6});
  }
}
function tickAura(dt){
  if(!auraMesh||!P||!P.armR) return;
  auraMesh.children.forEach((c,i)=>{ if(i===1) c.rotation.z += dt*2; });
  const wp = new THREE.Vector3(0,-1.5,0); P.armR.localToWorld(wp);
  for(const p of auraParts){
    p.a += dt*p.sp;
    p.m.position.set(wp.x+Math.cos(p.a)*p.r, wp.y+Math.sin(T*3+p.a)*.15, wp.z+Math.sin(p.a)*p.r);
    p.m.material.opacity=.4+.4*Math.abs(Math.sin(T*4+p.a));
  }
}

/* --- 대장장이 NPC --- */
(function addBlacksmith(){
  try{
    if(typeof NP==='undefined'||typeof char==='undefined') return;
    if(NP.some(n=>n.t==='e')) return;
    const n={n:'대장장이',t:'e',x:8,z:-8,sh:0xb87333,e:'🔨'};
    const c=char(0xf5c98a,n.sh,0x4a3a2a,false);
    c.g.position.set(n.x,0,n.z); n.c=c; S.add(c.g);
    S.add(box(3.4,.3,3.4,n.sh,n.x,3.9,n.z+.8),box(.25,3.8,.25,0x5a3a20,n.x-1.5,1.9,n.z+2.3),box(.25,3.8,.25,0x5a3a20,n.x+1.5,1.9,n.z+2.3),box(2.8,1,.9,0x8b5a2b,n.x,.5,n.z+1.4));
    n.tag=document.createElement('div'); n.tag.className='tag'; document.body.appendChild(n.tag);
    NP.push(n);
    if(typeof CL!=='undefined') CL.push({x:n.x,z:n.z,r:.8});
  }catch(e){console.warn('blacksmith',e);}
})();

/* 강화 UI */
const enhPanel=document.createElement('div');
enhPanel.id='rpgEnh';enhPanel.className='p';
enhPanel.style.cssText='display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,94vw);max-height:80vh;overflow:auto;z-index:55;padding:14px;font-size:13px';
document.body.appendChild(enhPanel);

const ENH_RATE=[1,1,1,1,1,1,0.9,0.8,0.7,0.55,0.4,0.3,0.22,0.15,0.1,0.06];
const ENH_MAT_W=[null,
  {mat:'gtooth',n:2,gold:50},{mat:'tusk',n:2,gold:120},{mat:'bone',n:3,gold:250},{mat:'essence',n:2,gold:500},{mat:'core',n:1,gold:900},
  {mat:'dshard',n:1,gold:1800},{mat:'hfang',n:2,gold:3500},{mat:'dscale',n:1,gold:7000},{mat:'dscale',n:2,gold:14000},{mat:'tkd',n:1,gold:28000},
  {mat:'tk5',n:1,gold:50000},{mat:'wscale',n:1,gold:90000},{mat:'wscale',n:2,gold:160000},{mat:'wscale',n:3,gold:280000},{mat:'wscale',n:5,gold:500000}];
const ENH_MAT_A=[null,
  {mat:'hide',n:2,gold:50},{mat:'fur',n:3,gold:120},{mat:'bandage',n:2,gold:250},{mat:'ooze',n:2,gold:500},{mat:'core',n:1,gold:900},
  {mat:'dshard',n:1,gold:1800},{mat:'flamecore',n:1,gold:3500},{mat:'dscale',n:1,gold:7000},{mat:'dscale',n:2,gold:14000},{mat:'tk5',n:1,gold:28000},
  {mat:'tk9',n:1,gold:50000},{mat:'wscale',n:1,gold:90000},{mat:'wscale',n:2,gold:160000},{mat:'wscale',n:3,gold:280000},{mat:'wscale',n:5,gold:500000}];

function matName(id){
  if(typeof ITEM!=='undefined'&&ITEM[id]) return ITEM[id][1]+' '+ITEM[id][0];
  return id;
}
function drawEnhance(){
  const we=me.we||0, ae=me.ae||0;
  let h='<h3 style="margin:0 0 8px;display:flex;justify-content:space-between"><span>🔨 장비 강화</span><button class="x" style="width:auto;margin:0;padding:4px 10px" onclick="document.getElementById(\'rpgEnh\').style.display=\'none\';ui=0">닫기</button></h3>';
  h+='<div style="opacity:.85;margin-bottom:8px">+1~+5 확정 · +6부터 확률 · 실패 시 +5 이하로 하락하지 않음<br>공격 보너스 <b>+'+enhAtkBonus(we)+'</b> · 체력 보너스 <b>+'+enhHpBonus(ae)+'</b></div>';
  // 무기
  h+='<div style="padding:8px;background:#ffd34d18;border-radius:10px;margin-bottom:10px">';
  h+='<b>⚔️ 무기 강화 +'+we+(we>=7?' ✨':'')+'</b>';
  if(we>=15) h+='<div style="margin-top:6px;color:var(--gold)">최대 강화 달성!</div>';
  else {
    const need=ENH_MAT_W[we+1], rate=ENH_RATE[we+1];
    const have=(me.items&&me.items[need.mat])||0;
    h+='<div style="margin-top:6px;font-size:12px">다음 +'+(we+1)+' · 성공률 '+(rate*100|0)+'%<br>재료: '+matName(need.mat)+' ×'+need.n+' (보유 '+have+') · 🪙'+need.gold.toLocaleString()+'</div>';
    h+='<button style="margin-top:6px" '+(have<need.n||me.coin<need.gold?'disabled':'')+' onclick="window.__doEnh(\'w\')">강화하기</button>';
  }
  h+='</div>';
  // 방어구
  h+='<div style="padding:8px;background:#6bd0ff18;border-radius:10px;margin-bottom:10px">';
  h+='<b>🛡️ 방어구 강화 +'+ae+'</b>';
  if(ae>=15) h+='<div style="margin-top:6px;color:var(--gold)">최대 강화 달성!</div>';
  else {
    const need=ENH_MAT_A[ae+1], rate=ENH_RATE[ae+1];
    const have=(me.items&&me.items[need.mat])||0;
    h+='<div style="margin-top:6px;font-size:12px">다음 +'+(ae+1)+' · 성공률 '+(rate*100|0)+'%<br>재료: '+matName(need.mat)+' ×'+need.n+' (보유 '+have+') · 🪙'+need.gold.toLocaleString()+'</div>';
    h+='<button style="margin-top:6px" '+(have<need.n||me.coin<need.gold?'disabled':'')+' onclick="window.__doEnh(\'a\')">강화하기</button>';
  }
  h+='</div>';
  h+='<div style="opacity:.7;font-size:11px">재료는 몬스터 전리품(드래곤 비늘, 암흑 갑옷 조각 등)으로 모을 수 있어요.</div>';
  enhPanel.innerHTML=h;
}
window.__doEnh=async function(slot){
  try{
    const headers={'Content-Type':'application/json'};
    let tok=null;try{tok=localStorage.getItem('rpg_token');}catch(_){}
    if(tok)headers['x-rpg-token']=tok;
    const res=await fetch('/api/enhance',{method:'POST',credentials:'same-origin',headers,body:JSON.stringify({slot})});
    const data=await res.json();
    if(!res.ok){toast(data.error||'강화 실패');return;}
    me.coin=data.coin; if(data.items) me.items=data.items;
    me.we=data.we|0; me.ae=data.ae|0;
    if(typeof stats==='function') stats();
    if(typeof hud==='function') hud();
    if(data.result==='success') toast('✨ 강화 성공! +'+data.level+(data.level>=7?' 아우라 해금!':''));
    else if(data.result==='down') toast('💥 강화 실패… +'+data.level+'로 하락');
    else toast('강화 실패 (단계 유지)');
    drawEnhance();
  }catch(e){toast('서버 연결 실패');}
};

/* talk 확장: 대장장이 */
const _talk0=typeof talk==='function'?talk:null;
if(_talk0){
  window.talk=function(){
    const n=typeof nearNPC==='function'?nearNPC():null;
    if(n&&n.t==='e'){
      ui=1; enhPanel.style.display='block'; drawEnhance(); return true;
    }
    return _talk0();
  };
}

/* --- 보스 쉴드 / 크리스탈 / 장판 클라이언트 --- */
const bossShields=new Map(); // id -> {mesh, elem}
const bossCrystals=new Map(); // id -> meshes[]
const floorMarks=[];
const SHIELD_COL={fire:0xff6a1a,ice:0x9fe8ff,dark:0xb04bff,poison:0x6aff4a,all:0xffd34d};

function makeShieldMesh(elem){
  const col=SHIELD_COL[elem]||0xffffff;
  const g=new THREE.Group();
  const s=new THREE.Mesh(new THREE.SphereGeometry(1,16,12), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}));
  g.add(s);
  const r=new THREE.Mesh(new THREE.TorusGeometry(1.05,.06,8,24), new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.7}));
  r.rotation.x=Math.PI/2; g.add(r);
  return g;
}
function placeShield(id, elem, e){
  clearShield(id);
  const mesh=makeShieldMesh(elem);
  const sc=(e&&e.sc)||2.5;
  mesh.scale.setScalar(sc*1.8);
  mesh.position.set(e?e.x:0, (e&&e.hy)||3, e?e.z:0);
  S.add(mesh);
  bossShields.set(id,{mesh,elem,e});
}
function clearShield(id){
  const o=bossShields.get(id); if(!o) return;
  S.remove(o.mesh); bossShields.delete(id);
}
function placeCrystals(id, list){
  clearCrystals(id);
  const meshes=[];
  for(const c of list){
    const g=new THREE.Group();
    const m=new THREE.Mesh(new THREE.OctahedronGeometry(1.1), new THREE.MeshBasicMaterial({color:0x6bffea,transparent:true,opacity:.9}));
    m.position.y=1.2; g.add(m);
    const glow=new THREE.Mesh(new THREE.SphereGeometry(.5,8,8), new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35}));
    glow.position.y=1.2; g.add(glow);
    g.position.set(c.x,0,c.z); S.add(g);
    meshes.push({g,m,x:c.x,z:c.z,hp:c.hp});
  }
  bossCrystals.set(id,meshes);
}
function clearCrystals(id){
  const arr=bossCrystals.get(id); if(!arr) return;
  for(const c of arr) S.remove(c.g); bossCrystals.delete(id);
}
function placeFloorWaves(waves){
  for(const w of waves){
    for(const pt of w.pts){
      const m=new THREE.Mesh(new THREE.CircleGeometry(pt.r,28).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({color:0xff2020,transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false}));
      m.position.set(pt.x,.08,pt.z); S.add(m);
      floorMarks.push({m, t:w.t, life:w.t, r:pt.r, x:pt.x, z:pt.z});
    }
  }
}
function tickBossFx(dt){
  for(const [id,o] of bossShields){
    const e=E.find(x=>x.serverId===id||x.id===id);
    if(e){ o.mesh.position.x=e.x; o.mesh.position.z=e.z; o.mesh.position.y=(e.hy||3)*(e.g&&e.g.scale?e.g.scale.y:1)*.5; }
    o.mesh.rotation.y+=dt*.8;
    o.mesh.children[0].material.opacity=.2+.1*Math.sin(T*5);
  }
  for(const [id,arr] of bossCrystals){
    for(const c of arr){ c.m.rotation.y+=dt*2; c.m.position.y=1.2+Math.sin(T*4+c.x)*.15; }
  }
  for(let i=floorMarks.length-1;i>=0;i--){
    const f=floorMarks[i]; f.t-=dt;
    const p=Math.max(0,f.t/f.life);
    f.m.material.opacity=.15+.25*(1-p)+.1*Math.sin(T*12);
    f.m.scale.setScalar(.7+p*.3);
    if(f.t<=0){ S.remove(f.m); floorMarks.splice(i,1); }
  }
}

/* 네트워크 메시지 훅 */
const _onNet=window.__rpgOnNetMsg;
window.__rpgOnNetMsg=function(msg){
  if(_onNet) try{_onNet(msg);}catch(_){}
  if(!msg||!msg.type) return;
  if(msg.type==='shield_on'){
    const e=E.find(x=>x.serverId===msg.id||x.id===msg.id);
    placeShield(msg.id, msg.elem, e||{x:0,z:0,hy:4,sc:2});
    if(typeof toast==='function') toast('🛡️ '+(msg.name||'쉴드')+' 전개! 속성 스킬로 파괴하세요');
  } else if(msg.type==='shield_break'){
    clearShield(msg.id); if(typeof toast==='function') toast('💥 쉴드 파괴!');
  } else if(msg.type==='shield_block'){
    if(typeof toast==='function') toast('🛡️ 쉴드에 막힘! 필요 속성: '+(msg.elem||'?'));
  } else if(msg.type==='shield_hit'){
    /* optional bar update */
  } else if(msg.type==='crystals'){
    placeCrystals(msg.id, msg.list||[]);
    if(typeof toast==='function') toast('💎 수정이 나타났습니다! 파괴하면 그로기!');
  } else if(msg.type==='cr_break'){
    const arr=bossCrystals.get(msg.id);
    if(arr&&arr[msg.i]){ S.remove(arr[msg.i].g); arr[msg.i]=null; }
  } else if(msg.type==='groggy'){
    clearCrystals(msg.id);
    if(typeof toast==='function') toast('💫 그로기! 3~5초간 크리티컬 200%');
    const e=E.find(x=>x.serverId===msg.id||x.id===msg.id);
    if(e) float(e.g.position.clone().setY((e.hy||4)+1),'GROGGY!','#ffd34d');
  } else if(msg.type==='groggy_end'){
    /* noop */
  } else if(msg.type==='floor_pat'){
    placeFloorWaves(msg.waves||[]);
    if(typeof toast==='function') toast('⚠️ 장판 패턴! 대쉬(0/V)로 피하세요');
  } else if(msg.type==='floor_boom'){
    for(const pt of (msg.pts||[])){
      if(typeof fxRing==='function') fxRing(pt.x,pt.z,pt.r||3.5,0xff3030,.6);
    }
  }
};

/* srvHit에 원소 전달: list 항목 [id,dmg,kb,elem] */
const _srvHit=window.srvHit;
if(_srvHit){
  window.srvHit=function(e,dm,kb,elem){
    // 크리스탈 우선 타격
    for(const [mid,arr] of bossCrystals){
      if(!arr) continue;
      for(let i=0;i<arr.length;i++){
        const c=arr[i]; if(!c) continue;
        if(Math.hypot(c.x-me.x,c.z-me.z)<4.2){
          // 서버에 크리스탈 히트
          const w=typeof window.__rpgWs==='function'?window.__rpgWs():null;
          if(w&&w.readyState===1){
            try{w.send(JSON.stringify({type:'hit',list:[['cr_'+mid, dm, 0, elem||'slash']]}));}catch(_){}
          }
          float(new THREE.Vector3(c.x,2,c.z), dm, '#6bffea');
          return;
        }
      }
    }
    _srvHit(e,dm,kb);
    // 원소 정보를 다음 hit 배치에 실을 수 있게 큐
    if(e&&e.serverId!=null){
      window.__pendingElem = window.__pendingElem||{};
      window.__pendingElem[e.serverId]=elem||'slash';
    }
  };
}

window.__towerHit=async()=>{
  if(!towerSess||towerSim.dead)return;

  const dmg=Math.max(1,Math.floor((typeof atk==='function'?atk():20)* (0.85+Math.random()*0.3)));

  float(P.g.position.clone().setY(3), dmg, '#fff');

    towerSim.dead=true; towerSim.hp=0;
    try{
      const data=await apiPost('/api/tower/kill',{});
      towerSess.kills=data.kills;

/* ---- 특성/룬 효과 적용 ---- */
const _atkBase=typeof atk==='function'?atk:()=>10;
window.atk=function(){
  let a=_atkBase();
  const t=me.talents||{};
  // 룬
  const runes=me.runes||[], eq=me.runeEq||{};
  for(const s of['w','a','u']){ const r=runes.find(x=>x.id===eq[s]); if(r&&r.opt==='atk') a+=r.val; if(r&&r.opt==='crit') {/* handled elsewhere */} }
  if(me.items&&me.items.rAtk) a=Math.floor(a*(1+0.05*me.items.rAtk));
  return Math.floor(a);
};
const _statsBase=typeof stats==='function'?stats:()=>{};
window.stats=function(){
  _statsBase();
  const t=me.talents||{};
  if(t.def_hp) me.mhp=Math.floor(me.mhp*(1+0.03*t.def_hp));
  if(me.items&&me.items.rHp) me.mhp=Math.floor(me.mhp*(1+0.05*me.items.rHp));
  const runes=me.runes||[], eq=me.runeEq||{};
  for(const s of['w','a','u']){ const r=runes.find(x=>x.id===eq[s]); if(r&&r.opt==='hp') me.mhp+=r.val; }
  me.hp=Math.min(me.mhp,me.hp);
};

/* 대쉬 크리 특성 */
let dashCritT=0;
const _extR=typeof ext==='function'?ext:function(){};
ext=function(dt){
  _extR(dt);
  if(dashCritT>0) dashCritT-=dt;
  // 위기 보호막
  if((me.talents||{}).def_shield && me.hp>0 && me.hp/me.mhp<=0.3 && !me._talShield){
    me._talShield=1; me.inv=Math.max(me.inv||0, 1.5+(me.talents.def_shield|0)*0.5);
    if(typeof toast==='function') toast('🛡️ 위기 보호막!');
  }
  if(me.hp/me.mhp>0.35) me._talShield=0;
};

/* 대쉬 시 특성 트리거 - doDash 훅 */
if(typeof doDash==='function'){
  const _dd=doDash;
  window.doDash=function(){
    const r=_dd.apply(this,arguments);
    if((me.talents||{}).atk_dash) dashCritT=2;
    return r;
  };
}

function updateRebirthAura(){
  if(rbAura){try{S.remove(rbAura);}catch(_){} rbAura=null;}
  if(!(me.items&&me.items.raura) && !(me.rebirth>=1)) return;
  if(!(me.items&&me.items.raura)) return;
  const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.08,8,24), new THREE.MeshBasicMaterial({color:0xc9a0ff,transparent:true,opacity:.7}));
  ring.rotation.x=Math.PI/2; ring.position.y=.15; g.add(ring);
  const ring2=new THREE.Mesh(new THREE.TorusGeometry(1.5,.05,8,24), new THREE.MeshBasicMaterial({color:0x9b6dff,transparent:true,opacity:.4}));
  ring2.rotation.x=Math.PI/2; ring2.position.y=.2; g.add(ring2);
  S.add(g); rbAura=g;
}
const _extAura=ext;
ext=function(dt){
  _extAura(dt);
  if(rbAura&&P&&P.g){ rbAura.position.set(me.x,0,me.z); rbAura.rotation.y+=dt*1.2; }
};

/* 네트워크: 룬 드랍 */
const _net=window.__rpgOnNetMsg;
window.__rpgOnNetMsg=function(msg){
  if(_net) try{_net(msg);}catch(_){}
  if(msg&&msg.type==='rune_drop'&&msg.rune){
    me.runes=me.runes||[]; me.runes.push(msg.rune);
    if(typeof toast==='function') toast('💠 룬 획득! '+msg.rune.name+(msg.rune.tier>=3?' ★★':'') );
  }
};

/* 동기화 */
setTimeout(async()=>{
  try{
    const info=await apiGet('/api/tower/info');
    me.towerBest=info.towerBest|0; me.rebirth=info.rebirth|0; me.rcoin=info.rcoin|0;
    me.title=info.title||''; me.talentPts=info.talentPts|0; me.talents=info.talents||{};
    me.runes=info.runes||[]; me.runeEq=info.runeEq||{w:null,a:null,u:null};
    updateRebirthAura();
  }catch(_){}
},2000);

console.log('[v-endgame] rebirth / tower / talent / rune ready');
})();
</script>
